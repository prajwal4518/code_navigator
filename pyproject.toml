[project]
name = "code-navigator"
version = "0.1.0"
description = "A RAG-based codebase navigator for intelligent code search and understanding"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Prajwal Padal" }
]

# Core dependencies for the RAG pipeline
dependencies = [
    # LLM Orchestration
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",  # Gemini integration
    "langchain-community>=0.3.0",
    # Vector Store
    "chromadb>=0.5.0",
    # Embeddings (local-first, falls back to API)
    "sentence-transformers>=3.0.0",
    # Code Parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    # API Serving
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Observability & MLOps
    "mlflow>=2.17.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "rich>=13.9.0",  # Beautiful CLI output
    "google-generativeai>=0.8.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "pre-commit>=4.0.0",
    "ipython>=8.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_navigator"]

# Ruff configuration - fast Python linter & formatter
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["code_navigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
